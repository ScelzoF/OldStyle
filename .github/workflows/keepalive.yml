name: Keep OldStyle available

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping OldStyle
        run: |
          cookie_jar=$(mktemp)
          trap 'rm -f "$cookie_jar"' EXIT
          curl --silent --show-error --fail --location --max-redirs 10 --max-time 25 \
            --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            --output /dev/null --write-out "HTTP %{http_code}\n" \
            -H "User-Agent: Mozilla/5.0 (compatible; OldStyle-Keepalive/1.1)" \
            https://sismoold.streamlit.app/
